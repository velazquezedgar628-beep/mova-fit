<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVA | Sistema de Autenticación & Avatares</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Syne & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        syne: ['Syne', 'sans-serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        mova: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            dark: '#0a0f0d'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .mova-brand { font-family: 'Syne', sans-serif; font-weight: 800; }
        .avatar-card { transition: all 0.25s ease; }
        .avatar-card:hover { transform: translateY(-3px); }
        .avatar-card.selected { border-color: #10b981; background-color: #f0fdf4; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans justify-center items-center p-4">

    <!-- MODAL DE AUTENTICACIÓN Y REGISTRO MOVA -->
    <div id="auth-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 md:p-8 shadow-2xl my-8 relative overflow-hidden text-slate-100">
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-emerald-500 via-teal-400 to-emerald-600"></div>
            
            <!-- Encabezado de Marca -->
            <div class="text-center mb-6">
                <span class="mova-brand text-4xl tracking-widest text-white">M O V A <span class="text-emerald-500">.</span></span>
                <p class="text-slate-400 text-xs mt-1 font-semibold uppercase tracking-wider">Nutrición · Ciencia · Movimiento</p>
            </div>

            <!-- Selector de Pestañas: Login / Registro -->
            <div class="flex bg-slate-800/80 p-1 rounded-2xl mb-6 border border-slate-700/60">
                <button type="button" onclick="switchTab('login')" id="btn-tab-login" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition bg-emerald-600 text-white shadow-md">Iniciar Sesión</button>
                <button type="button" onclick="switchTab('register')" id="btn-tab-register" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white">Registrarse</button>
            </div>

            <!-- FORMULARIO 1: INICIAR SESIÓN -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full bg-slate-800/60 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition" placeholder="tu@email.com">
                </div>
                <div>
                    <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-800/60 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition" placeholder="••••••••">
                </div>
                
                <div id="login-error" class="text-red-400 text-xs font-bold text-center hidden">Email o contraseña incorrectos.</div>

                <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl shadow-lg shadow-emerald-600/30 transition uppercase text-xs tracking-wider">Ingresar a MOVA</button>
            </form>

            <!-- FORMULARIO 2: REGISTRO DE USUARIO -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">Correo Electrónico</label>
                    <input type="email" id="reg-email" required class="w-full bg-slate-800/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="tu@email.com">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">Contraseña</label>
                        <input type="password" id="reg-password" required class="w-full bg-slate-800/60 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="••••••••">
                    </div>
                    <div>
                        <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">Repetir Contraseña</label>
                        <input type="password" id="reg-confirm" required class="w-full bg-slate-800/60 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="••••••••">
                    </div>
                </div>

                <!-- SELECCIÓN DE AVATAR (6 ESTEREOTIPOS x M/F) -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">Selecciona tu Avatar</label>
                        <!-- Selector de Género -->
                        <div class="flex bg-slate-800 p-0.5 rounded-lg border border-slate-700">
                            <button type="button" onclick="setGender('M')" id="gender-m-btn" class="px-2.5 py-1 rounded-md text-[10px] font-bold bg-emerald-600 text-white transition">M</button>
                            <button type="button" onclick="setGender('F')" id="gender-f-btn" class="px-2.5 py-1 rounded-md text-[10px] font-bold text-slate-400 transition">F</button>
                        </div>
                    </div>

                    <!-- Grilla de 6 Avatares -->
                    <div class="grid grid-cols-3 gap-2" id="avatars-grid"></div>
                </div>

                <div id="reg-error" class="text-red-400 text-xs font-bold text-center hidden">Las contraseñas no coinciden.</div>

                <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl shadow-lg shadow-emerald-600/30 transition uppercase text-xs tracking-wider">Crear Cuenta & Continuar</button>
            </form>

            <!-- ACCESO DIRECTO INVITADO -->
            <div class="mt-6 text-center border-t border-slate-800 pt-4">
                <button type="button" onclick="loginAsGuest()" class="text-xs text-slate-400 hover:text-emerald-400 font-bold transition underline">Ingresar como Invitado (Modo Exploración) &rarr;</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA BIENVENIDA / DASHBOARD (PRUEBA DE ACCESO) -->
    <div id="app-dashboard" class="hidden max-w-xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl">
        <div id="user-avatar-display" class="w-20 h-20 mx-auto rounded-3xl bg-emerald-600/20 border-2 border-emerald-500 flex items-center justify-center p-2 mb-4"></div>
        <h2 class="text-2xl font-black text-white" id="welcome-user-name">¡Bienvenido!</h2>
        <p class="text-slate-400 text-xs mt-1" id="welcome-user-email"></p>
        <div class="mt-4 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl p-3 text-emerald-400 text-xs font-bold">
            ✓ Acceso verificado correctamente. Datos guardados con éxito.
        </div>
        <button onclick="logout()" class="mt-6 px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl transition">Cerrar Sesión</button>
    </div>

    <!-- SCRIPT DE CONTROL -->
    <script>
        // Definición de los 6 Estereotipos de Avatares (Versiones Masculina y Femenina en SVG)
        const avatarProfiles = [
            {
                id: 'atleta',
                title: 'Atleta / Gym',
                icon: 'fa-dumbbell',
                svgM: `<svg viewBox="0 0 64 64" class="w-full h-full fill-emerald-400"><circle cx="32" cy="20" r="12"/><path d="M16 52c0-8.8 7.2-16 16-16s16 7.2 16 16v4H16v-4z"/><path d="M12 28h8v6h-8zM44 28h8v6h-8z" fill="#059669"/></svg>`,
                svgF: `<svg viewBox="0 0 64 64" class="w-full h-full fill-emerald-400"><circle cx="32" cy="20" r="11"/><path d="M18 52c0-7.7 6.3-14 14-14s14 6.3 14 14v4H18v-4z"/><path d="M20 12c-4 0-8 6-8 12h6zM44 12c4 0 8 6 8 12h-6z" fill="#059669"/></svg>`
            },
            {
                id: 'runner',
                title: 'Runner / Cardio',
                icon: 'fa-person-running',
                svgM: `<svg viewBox="0 0 64 64" class="w-full h-full fill-emerald-400"><circle cx="32" cy="18" r="10"/><path d="M20 54c0-6.6 5.4-12 12-12s12 5.4 12 12v2H20v-2z"/><path d="M24 16l16-4v6L24 22z" fill="#059669"/></svg>`,
                svgF: `<svg viewBox="0 0 64 64" class="w-full h-full fill-emerald-400"><circle cx="32" cy="18" r="10"/><path d="M22 54c0-5.5 4.5-10 10-10s10 4.5 10 10v2H22v-2z"/><path d="M16 18c0 8 6 12 16 12s16-4 16-12z" fill="#059669" opacity="0.4"/></svg>`
            },
            {
                id: 'ejecutivo',
                title: 'Ejecutivo / Biz',
                icon: 'fa-user-tie',
                svgM: `<svg viewBox="0 0 64 64" class="w-full h-full fill-emerald-400"><circle cx="32" cy="18" r="10"/><path d="M18 52c0-7.7 6.3-14 14-14s14 6.3 14 14v4H18v-4z"/><path d="M30 38l2 10 2-10z" fill="#ffffff"/></svg>`,
                svgF: `<svg viewBox="0 0 64 64" class="w-full h-full fill-emerald-400"><circle cx="32" cy="18" r="10"/><path d="M20 52c0-6.6 5.4-12 12-12s12 5.4 12 12v4H20v-4z"/><path d="M26 38l6 6 6-6z" fill="#ffffff"/></svg>`
            },
            {
                id: 'biohacker',
                title: 'Biohacker / Tech',
                icon: 'fa-microchip',
                svgM: `<svg viewBox="0 0 64 64" class="w-full h-full fill-emerald-400"><circle cx="32" cy="20" r="11"/><path d="M18 52c0-7.7 6.3-14 14-14s14 6.3 14 14v4H18v-4z"/><rect x="22" y="16" width="20" height="6" rx="3" fill="#34d399"/></svg>`,
                svgF: `<svg viewBox="0 0 64 64" class="w-full h-full fill-emerald-400"><circle cx="32" cy="20" r="10"/><path d="M20 52c0-6.6 5.4-12 12-12s12 5.4 12 12v4H20v-4z"/><rect x="22" y="16" width="20" height="6" rx="3" fill="#34d399"/></svg>`
            },
            {
                id: 'holistico',
                title: 'Holístico / Yoga',
                icon: 'fa-spa',
                svgM: `<svg viewBox="0 0 64 64" class="w-full h-full fill-emerald-400"><circle cx="32" cy="22" r="10"/><path d="M20 52c0-6.6 5.4-12 12-12s12 5.4 12 12v4H20v-4z"/><path d="M32 6l4 8h-8z" fill="#a7f3d0"/></svg>`,
                svgF: `<svg viewBox="0 0 64 64" class="w-full h-full fill-emerald-400"><circle cx="32" cy="22" r="10"/><path d="M22 52c0-5.5 4.5-10 10-10s10 4.5 10 10v4H22v-4z"/><path d="M32 6l4 8h-8z" fill="#a7f3d0"/></svg>`
            },
            {
                id: 'urbano',
                title: 'Urbano / Style',
                icon: 'fa-city',
                svgM: `<svg viewBox="0 0 64 64" class="w-full h-full fill-emerald-400"><circle cx="32" cy="22" r="10"/><path d="M18 52c0-7.7 6.3-14 14-14s14 6.3 14 14v4H18v-4z"/><path d="M20 14h24v6H20z" fill="#059669"/></svg>`,
                svgF: `<svg viewBox="0 0 64 64" class="w-full h-full fill-emerald-400"><circle cx="32" cy="22" r="10"/><path d="M20 52c0-6.6 5.4-12 12-12s12 5.4 12 12v4H20v-4z"/><path d="M18 14h28v6H18z" fill="#059669"/></svg>`
            }
        ];

        let selectedGender = 'M';
        let selectedAvatarIndex = 0;

        window.addEventListener('DOMContentLoaded', () => {
            renderAvatars();
            checkSession();
        });

        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('btn-tab-login').className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition bg-emerald-600 text-white shadow-md";
                document.getElementById('btn-tab-register').className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition text-slate-400";
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-register').classList.add('hidden');
            } else {
                document.getElementById('btn-tab-register').className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition bg-emerald-600 text-white shadow-md";
                document.getElementById('btn-tab-login').className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition text-slate-400";
                document.getElementById('form-register').classList.remove('hidden');
                document.getElementById('form-login').classList.add('hidden');
            }
        }

        function setGender(g) {
            selectedGender = g;
            document.getElementById('gender-m-btn').className = g === 'M' ? "px-2.5 py-1 rounded-md text-[10px] font-bold bg-emerald-600 text-white transition" : "px-2.5 py-1 rounded-md text-[10px] font-bold text-slate-400 transition";
            document.getElementById('gender-f-btn').className = g === 'F' ? "px-2.5 py-1 rounded-md text-[10px] font-bold bg-emerald-600 text-white transition" : "px-2.5 py-1 rounded-md text-[10px] font-bold text-slate-400 transition";
            renderAvatars();
        }

        function renderAvatars() {
            const grid = document.getElementById('avatars-grid');
            grid.innerHTML = avatarProfiles.map((item, idx) => `
                <div onclick="selectAvatar(${idx})" class="avatar-card p-2 rounded-2xl bg-slate-800/60 border border-slate-700/80 text-center cursor-pointer ${selectedAvatarIndex === idx ? 'selected' : ''}">
                    <div class="w-10 h-10 mx-auto">
                        ${selectedGender === 'M' ? item.svgM : item.svgF}
                    </div>
                    <span class="block text-[9px] font-bold text-slate-300 mt-1 truncate">${item.title}</span>
                </div>
            `).join('');
        }

        function selectAvatar(idx) {
            selectedAvatarIndex = idx;
            renderAvatars();
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            
            const storedUser = JSON.parse(localStorage.getItem('mova_registered_user'));

            if (storedUser && storedUser.email === email && storedUser.password === pass) {
                grantAccess(storedUser);
            } else if (email && pass) {
                // Si no hay registrado o es cuenta de prueba
                grantAccess({ email: email, avatarSvg: avatarProfiles[0].svgM });
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;

            if (pass !== confirm) {
                document.getElementById('reg-error').classList.remove('hidden');
                return;
            }
            document.getElementById('reg-error').classList.add('hidden');

            const chosenAvatar = avatarProfiles[selectedAvatarIndex];
            const newUser = {
                email: email,
                password: pass,
                gender: selectedGender,
                avatarSvg: selectedGender === 'M' ? chosenAvatar.svgM : chosenAvatar.svgF,
                avatarTitle: chosenAvatar.title
            };

            // Guardado en almacenamiento local de alto rendimiento
            localStorage.setItem('mova_registered_user', JSON.stringify(newUser));
            grantAccess(newUser);
        }

        function loginAsGuest() {
            grantAccess({
                email: 'invitado@mova.fit',
                avatarSvg: avatarProfiles[0].svgM,
                avatarTitle: 'Invitado Explorador'
            });
        }

        function grantAccess(user) {
            localStorage.setItem('mova_active_session', JSON.stringify(user));
            document.getElementById('auth-modal').classList.add('hidden');
            
            // Mostrar Pantalla de Verificación Correcta
            document.getElementById('welcome-user-name').innerText = `¡Bienvenido, ${user.email.split('@')[0]}!`;
            document.getElementById('welcome-user-email').innerText = user.email;
            document.getElementById('user-avatar-display').innerHTML = user.avatarSvg;
            document.getElementById('app-dashboard').classList.remove('hidden');
        }

        function checkSession() {
            const active = localStorage.getItem('mova_active_session');
            if (active) {
                grantAccess(JSON.parse(active));
            }
        }

        function logout() {
            localStorage.removeItem('mova_active_session');
            document.getElementById('app-dashboard').classList.add('hidden');
            document.getElementById('auth-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
